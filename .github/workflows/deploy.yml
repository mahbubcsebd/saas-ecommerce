name: Deploy SaaS E-Commerce Monorepo to Google Cloud

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to GCP VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Force load NVM and use Node 26 system default
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 26 || nvm use default

            # 2. Navigate to root and pull fresh code
            cd ~/saas-ecommerce
            git pull origin main

            # 3. Clean and Deploy Express API Backend (Port 5000)
            echo "⚡ Deploying Express API Backend..."
            cd ~/saas-ecommerce/backend/server
            # Safe delete only modules and lockfile to preserve existing .env file
            rm -rf node_modules package-lock.json
            npm install --legacy-peer-deps
            npm run db:generate
            pm2 delete express-api || true
            PORT=5000 CLIENT_URL="https://mahbuburrahman.xyz" ALLOWED_ORIGINS="https://mahbuburrahman.xyz,https://www.mahbuburrahman.xyz,https://admin.mahbuburrahman.xyz" pm2 start src/server.js --name "express-api"

            # 4. Wipe, Fresh Install, Build & Restart Admin Dashboard Client (Port 3001)
            echo "🎨 Deploying Admin Dashboard Client..."
            cd ~/saas-ecommerce/backend/client
            # Wipe stale state completely to prevent build resolution conflicts while keeping .env safe
            rm -rf node_modules .next package-lock.json
            npm install --legacy-peer-deps
            NODE_OPTIONS="--max-old-space-size=1024" npm run build
            pm2 delete next-dashboard || true
            pm2 start npm --name "next-dashboard" -- run start -- -p 3001

            # 5. Wipe, Fresh Install, Build & Restart Frontend Shop Client (Port 3000)
            echo "🛒 Deploying Frontend Shop Client..."
            cd ~/saas-ecommerce/frontend
            # Clear old production cache and lockfile for clean Tailwind v4 compilation
            rm -rf node_modules .next package-lock.json
            npm install --legacy-peer-deps
            NODE_OPTIONS="--max-old-space-size=1024" npm run build
            pm2 delete next-shop || true
            pm2 start npm --name "next-shop" -- run start -- -p 3000

            # 6. Global Persistence and Monitoring State
            pm2 save
            pm2 list
            echo "🚀 Deployment pipeline completed successfully! All processes are isolated, compiled and running fresh on Node 26."
