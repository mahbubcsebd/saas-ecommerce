name: Deploy SaaS E-Commerce Monorepo to Google Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch: # ম্যানুয়ালি ডিপ্লয় রান করার অপশন

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # কোন কোন ডিরেক্টরিতে পরিবর্তন হয়েছে তা ডিটেক্ট করবে
      - name: Check Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend_server:
              - 'backend/server/**'
            backend_client:
              - 'backend/client/**'
            frontend:
              - 'frontend/**'
            workflow:
              - '.github/workflows/deploy.yml'

      # ১. যদি ব্যাকএন্ড সার্ভারে পরিবর্তন হয়
      - name: Deploy Express API Backend
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.backend_server == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "⚡ Deploying Express API Backend..."
            cd ~/saas-ecommerce
            git pull origin main
            
            cd ~/saas-ecommerce/backend/server
            rm -rf node_modules package-lock.json
            npm install --production --legacy-peer-deps
            npm run db:generate
            PORT=5000 CLIENT_URL="https://mahbuburrahman.xyz" ALLOWED_ORIGINS="https://mahbuburrahman.xyz,https://admin.mahbuburrahman.xyz" pm2 restart express-api --update-env || PORT=5000 CLIENT_URL="https://mahbuburrahman.xyz" ALLOWED_ORIGINS="https://mahbuburrahman.xyz,https://admin.mahbuburrahman.xyz" pm2 start src/server.js --name "express-api"
            
            pm2 save
            echo "✅ Express API Backend successfully updated!"

      # ২. যদি এডমিন ড্যাশবোর্ডে পরিবর্তন হয়
      - name: Deploy Admin Dashboard Client
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.backend_client == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🎨 Deploying Admin Dashboard Client..."
            cd ~/saas-ecommerce
            git pull origin main
            
            cd ~/saas-ecommerce/backend/client
            rm -rf node_modules package-lock.json
            npm install --legacy-peer-deps
            rm -rf .next
            npm run build
            PORT=3001 pm2 restart next-dashboard --update-env || PORT=3001 pm2 start npm --name "next-dashboard" -- run start -- -p 3001
            
            pm2 save
            echo "✅ Admin Dashboard Client successfully updated!"

      # ৩. যদি ফ্রন্টএন্ড শপে পরিবর্তন হয়
      - name: Deploy Frontend Shop Client
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.frontend == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🛒 Deploying Frontend Shop Client..."
            cd ~/saas-ecommerce
            git pull origin main
            
            cd ~/saas-ecommerce/frontend
            rm -rf node_modules package-lock.json
            npm install --legacy-peer-deps
            rm -rf .next
            npm run build
            PORT=3000 pm2 restart next-shop --update-env || PORT=3000 pm2 start npm --name "next-shop" -- run start -- -p 3000
            
            pm2 save
            echo "✅ Frontend Shop Client successfully updated!"

      # ৪. পিএম২ স্ট্যাটাস এবং মেসেজ শো করবে
      - name: Show Running Status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/saas-ecommerce
            pm2 list
            echo "🚀 Deployment processes checked. All updated servers are live!"
