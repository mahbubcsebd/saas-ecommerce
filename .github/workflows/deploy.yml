name: Deploy SaaS E-Commerce Monorepo to Google Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual deployment trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Detect which directories have code changes vs dependency updates
      - name: Check Changed Paths and Dependencies
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend_server_code:
              - 'backend/**'
            backend_server_deps:
              - 'backend/package.json'
              - 'backend/package-lock.json'
            dashboard_code:
              - 'dashboard/**'
            dashboard_deps:
              - 'dashboard/package.json'
              - 'dashboard/package-lock.json'
            frontend_code:
              - 'frontend/**'
            frontend_deps:
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
            workflow:
              - '.github/workflows/deploy.yml'

      # STEP 0: Base Git Synchronization
      - name: Pull Latest Codebase
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: mahbub_cse_me
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            cd ~/saas-ecommerce
            git reset --hard HEAD
            git pull origin main
            echo "🚀 Codebase hard synchronized with main branch!"

      # STEP 1: Express API Backend Pipeline
      - name: Deploy Express API Backend
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.backend_server_code == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: mahbub_cse_me
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 26 || nvm use default

            cd ~/saas-ecommerce/backend

            if [ "${{ steps.filter.outputs.backend_server_deps }}" = "true" ] || [ ! -d "node_modules" ]; then
              echo "📦 Dependency changes detected. Running fresh npm install..."
              rm -rf node_modules package-lock.json
              npm install --legacy-peer-deps
            fi

            # Sourcing environment variables from VM server's local .env file
            if [ -f .env ]; then
              export $(grep -v '^#' .env | xargs)
            fi

            # Zero-Downtime Reload for Backend
            pm2 reload ecommerce-backend || pm2 start index.js --name "ecommerce-backend" --cwd "/home/mahbub_cse_me/saas-ecommerce/backend"

            pm2 save
            echo "✅ Express API Backend hot reloaded!"

      # STEP 2: Admin Dashboard Client Pipeline (Port 3001)
      - name: Deploy Admin Dashboard Client
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.dashboard_code == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: mahbub_cse_me
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 26 || nvm use default

            cd ~/saas-ecommerce/dashboard

            if [ "${{ steps.filter.outputs.dashboard_deps }}" = "true" ] || [ ! -d "node_modules" ]; then
              echo "📦 Dependency changes detected for Dashboard. Installing packages..."
              rm -rf node_modules package-lock.json
              npm install --legacy-peer-deps
            fi

            # 🚀 FIXED: Allocation of 3GB RAM to prevent build timeout crash
            rm -rf .next
            NODE_OPTIONS="--max-old-space-size=3072" npm run build

            # 🚀 FIXED: Text Typo and Correct PM2 NPM launch flags for Port 3001
            pm2 reload ecommerce-dashboard || pm2 start npm --name "ecommerce-dashboard" --cwd "/home/mahbub_cse_me/saas-ecommerce/dashboard" -- start -- -p 3001

            pm2 save
            echo "✅ Admin Dashboard Client hot reloaded!"

      # STEP 3: Frontend Shop Client Pipeline (Port 3000)
      - name: Deploy Frontend Shop Client
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.frontend_code == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: mahbub_cse_me
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 26 || nvm use default

            cd ~/saas-ecommerce/frontend

            if [ "${{ steps.filter.outputs.frontend_deps }}" = "true" ] || [ ! -d "node_modules" ]; then
              echo "📦 Dependency changes detected for Frontend. Installing packages..."
              rm -rf node_modules package-lock.json
              npm install --legacy-peer-deps
            fi

            # 🚀 FIXED: Allocated 3GB RAM for smooth frontend compilation
            rm -rf .next
            NODE_OPTIONS="--max-old-space-size=3072" npm run build

            # 🚀 FIXED: Correct PM2 NPM launch flags for Port 3000
            pm2 reload ecommerce-frontend || pm2 start npm --name "ecommerce-frontend" --cwd "/home/mahbub_cse_me/saas-ecommerce/frontend" -- start -- -p 3000

            pm2 save
            echo "✅ Frontend Shop Client hot reloaded!"

      # STEP 4: Global Verification State
      - name: Show Running Status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: mahbub_cse_me
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            pm2 list
            sudo ss -tulpn | grep -E "3000|3001|5000"
            echo "🚀 Professional Enterprise pipeline executed flawlessly!"