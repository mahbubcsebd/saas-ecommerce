name: Deploy SaaS E-Commerce Monorepo to Google Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual deployment trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Detect which directories have code changes vs dependency updates
      - name: Check Changed Paths and Dependencies
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend_server_code:
              - 'backend/server/**'
            backend_server_deps:
              - 'backend/server/package.json'
              - 'backend/server/package-lock.json'
            backend_client_code:
              - 'backend/client/**'
            backend_client_deps:
              - 'backend/client/package.json'
              - 'backend/client/package-lock.json'
            frontend_code:
              - 'frontend/**'
            frontend_deps:
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
            workflow:
              - '.github/workflows/deploy.yml'

      # STEP 0: Base Git Synchronization using Bulletproof Base64 SSH Key format
      - name: Pull Latest Codebase
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: mahbub_cse_me
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/saas-ecommerce
            git reset --hard HEAD
            git pull origin main
            echo "🚀 Codebase hard synchronized with main branch!"

      # STEP 1: Express API Backend Pipeline
      - name: Deploy Express API Backend
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.backend_server_code == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: mahbub_cse_me
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 26 || nvm use default

            cd ~/saas-ecommerce/backend/server

            # Conditional Optimization: Only install if package.json changed OR node_modules missing
            if [ "${{ steps.filter.outputs.backend_server_deps }}" = "true" ] || [ ! -d "node_modules" ]; then
              echo "📦 Dependency changes detected. Running fresh npm install..."
              rm -rf node_modules package-lock.json
              npm install --legacy-peer-deps
            fi

            npm run db:generate

            # Zero-Downtime Reload using explicit path binding
            PORT=5000 CLIENT_URL="https://mahbuburrahman.xyz" ALLOWED_ORIGINS="https://mahbuburrahman.xyz,https://admin.mahbuburrahman.xyz" pm2 reload express-api --update-env || PORT=5000 CLIENT_URL="https://mahbuburrahman.xyz" ALLOWED_ORIGINS="https://mahbuburrahman.xyz,https://admin.mahbuburrahman.xyz" pm2 start src/server.js --name "express-api" --cwd "/home/mahbub_cse_me/saas-ecommerce/backend/server"

            pm2 save
            echo "✅ Express API Backend hot reloaded!"

      # STEP 2: Admin Dashboard Client Pipeline
      - name: Deploy Admin Dashboard Client
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.backend_client_code == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: mahbub_cse_me
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 26 || nvm use default

            cd ~/saas-ecommerce/backend/client

            if [ "${{ steps.filter.outputs.backend_client_deps }}" = "true" ] || [ ! -d "node_modules" ]; then
              echo "📦 Dependency changes detected for Dashboard. Installing packages..."
              rm -rf node_modules package-lock.json
              npm install --legacy-peer-deps
            fi

            # Clean old build cache and re-build with Next.js 16 environment setup
            rm -rf .next
            NODE_OPTIONS="--max-old-space-size=1024" npm run build

            # Zero-Downtime Swap with bounded directory path
            pm2 reload ecommerce-dashboad || pm2 start npm --name "ecommerce-dashboad" --cwd "/home/mahbub_cse_me/saas-ecommerce/backend/client" -- run start -- -p 3001

            pm2 save
            echo "✅ Admin Dashboard Client hot reloaded!"

      # STEP 3: Frontend Shop Client Pipeline
      - name: Deploy Frontend Shop Client
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.frontend_code == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: mahbub_cse_me
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 26 || nvm use default

            cd ~/saas-ecommerce/frontend

            if [ "${{ steps.filter.outputs.frontend_deps }}" = "true" ] || [ ! -d "node_modules" ]; then
              echo "📦 Dependency changes detected for Frontend. Installing packages..."
              rm -rf node_modules package-lock.json
              npm install --legacy-peer-deps
            fi

            rm -rf .next
            NODE_OPTIONS="--max-old-space-size=1024" npm run build

            # Zero-Downtime Swap with bounded directory path
            pm2 reload ecommerce-frontend || pm2 start npm --name "ecommerce-frontend" --cwd "/home/mahbub_cse_me/saas-ecommerce/frontend" -- run start -- -p 3000

            pm2 save
            echo "✅ Frontend Shop Client hot reloaded!"

      # STEP 4: Global Verification State
      - name: Show Running Status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: mahbub_cse_me
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            pm2 list
            echo "🚀 Professional Enterprise pipeline executed flawlessly!"